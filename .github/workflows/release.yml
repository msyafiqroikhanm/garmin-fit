name: Release APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Same key the installed app was signed with; a different key makes Android reject the update.
      - name: Restore signing key
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Build
        run: >
          ./gradlew assembleRelease
          -PversionName=${GITHUB_REF_NAME#v}
          -PversionCode=${{ github.run_number }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk garmin-fit-${GITHUB_REF_NAME}.apk
          gh release create "$GITHUB_REF_NAME" garmin-fit-${GITHUB_REF_NAME}.apk --generate-notes
